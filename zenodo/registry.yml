# Zenodo deposit registry for Spherity Research.
#
# One entry per citable work (not per web page). Metadata is generated from the
# page front matter and docs/_data/authors.yml; this file records only archival
# decisions. Read zenodo/README.md before changing a status or gate.
#
# A Zenodo publication is effectively irreversible: files cannot be replaced and
# the DOI is permanent. Every gate must be "pass" or "n/a" before an entry may
# move to "cleared". Gates:
#   confidentiality  no NDA/consortium-internal material
#   disclosure       public disclosure intended. Spherity publishes and does not
#                    file patents (decision of 10 Nov 2026); the gate stays open
#                    only where a consortium or co-author must still agree
#   coauthors        every co-author approved deposit, author order and licence
#   rights           CC BY 4.0 grantable for every page, figure, quotation and logo
#   metadata_review  a person reviewed the generated metadata and a sandbox preview
#
# For pages already public on the website, confidentiality and disclosure are
# "pass": archiving the identical file adds no new disclosure. Rights and
# metadata review stay "open" until a person has checked the PDF itself.

